# Standalone Nginx Virtual Host for Recova-H2S (h2s.recovahq.com)
# Place at: /etc/nginx/sites-available/h2s.recovahq.com
# Enable:   sudo ln -sf /etc/nginx/sites-available/h2s.recovahq.com /etc/nginx/sites-enabled/h2s.recovahq.com
# Test:     sudo nginx -t && sudo systemctl reload nginx
# SSL:      sudo certbot --nginx -d h2s.recovahq.com --redirect
#
# Does not touch /etc/nginx/sites-available/recova or any existing subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name __H2S_DOMAIN__;

    access_log /var/log/nginx/__H2S_DOMAIN__.access.log;
    error_log  /var/log/nginx/__H2S_DOMAIN__.error.log;

    client_max_body_size 15m;

    # ACME HTTP-01 challenge for Let's Encrypt / Certbot
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        allow all;
    }

    # Direct reverse proxy to FastAPI backend (handles SSE streams cleanly without buffering)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:__H2S_BACKEND_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:__H2S_BACKEND_PORT__/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:__H2S_BACKEND_PORT__/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Next.js Standalone Frontend
    location / {
        proxy_pass http://127.0.0.1:__H2S_FRONTEND_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 120s;
    }
}
